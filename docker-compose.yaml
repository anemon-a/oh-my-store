version: '3'
services:
  db:
    image: postgres:latest
    container_name: database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes: 
      - store_db:/var/lib/postgresql/data
    networks:
      - store_net
    restart: always

volumes:
  store_db:
    name: store_db

networks:
  store_net:
    name: store_net